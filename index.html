<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Word Song Finder</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="bg-marble-gray">
    <main class="container">
      <h1>Word Song Finder</h1>
      <p class="subtitle">Generate a random word and find up to 300 matching song titles.</p>

      <button id="generateBtn" type="button">Generate New Word</button>
      <div class="game-controls">
        <button id="openGameBtn" type="button" class="game-toggle">Open Mini Game</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>

      <section>
        <h2>Generated word: <span id="word">—</span></h2>
        <p class="definition-line"><strong>Definition:</strong> <span id="definition">—</span></p>
      </section>

      <section id="miniGamePanel" class="mini-game-panel" hidden>
        <div class="mini-game-header">
          <h2>Mini Game: Quick Math</h2>
          <button id="closeGameBtn" type="button" class="game-close">Close Game</button>
        </div>
        <p class="mini-game-subtitle">Solve as many as you can while songs load.</p>
        <p id="mathPrompt" class="math-prompt">4 + 7 = ?</p>
        <div class="math-controls">
          <input id="mathAnswer" type="number" inputmode="numeric" placeholder="Answer" />
          <button id="submitMathBtn" type="button">Submit</button>
          <button id="nextMathBtn" type="button" class="secondary-btn">Skip</button>
        </div>
        <p id="mathFeedback" class="math-feedback" aria-live="polite">Press Submit to score.</p>
        <p class="math-score">Score: <span id="mathScore">0</span> | Streak: <span id="mathStreak">0</span></p>
      </section>

      <section>
        <h2>Songs by descending popularity</h2>
        <ol id="songList"></ol>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
